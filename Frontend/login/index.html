<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sebastian Cabelo e Estética</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <header>
        <nav>
            <a class="logo" href="/">Sebastian Cabelo e Estética</a>

            <div class="mobile-menu">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>

            <ul class="nav-list">
                <li><a href="/home/index.html">Home</a></li>
                <li><a href="/login/index.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="body1 page-bg-image">
        <div class="wrapper">
            <form>
                <h1>Login</h1>

                <div class="input-box">
                    <input type="text" placeholder="E-mail" required>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Senha" required>
                </div>

                <!-- Mensagem de erro da API -->
                <p id="msg-erro" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 8px; min-height: 18px;"></p>

                <div class="remember-forgot">
                    <label><input type="checkbox"> Lembrar senha</label>
                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn">Entrar</button>

                <div class="register-link">
                    <p>Não tem uma conta? <a href="/cadastro/index.html">Cadastre-se</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/mobile-navbar.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
