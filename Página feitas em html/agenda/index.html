<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Semanal - Sebastian Cabelo e Estética</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/agenda.css">
</head>

<body>
    <header>
        <nav>
            <a class="logo" href="/">Sebastian Cabelo e Estética</a>

            <div class="mobile-menu">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>

            <ul class="nav-list">
                <li><a href="/home/index.html">Home</a></li>
                <li><a href="/agenda/index.html">Agenda</a></li>
                <li><a href="/historico-cliente/index.html">Histórico de Cliente</a></li>
                <li><a href="/login/index.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="body1 page-bg-image">
        <div class="agenda-container">
            <div class="agenda-header-section">
                <div class="header-left">
                    <h1>Agenda Semanal</h1>
                    <p class="subtitle">Sebastian Cabelo e Estética &mdash; Área Profissional</p>
                </div>
                <div class="header-right">
                    <div class="badge-count"><span id="total-badge">0</span> agendamentos esta semana</div>
                    <div class="filter-group">
                        <label for="professional-filter">Filtrar por Profissional: </label>
                        <select id="professional-filter">
                            <option value="todos">Todos</option>
                            <option value="João">João</option>
                            <option value="Maria">Maria</option>
                            <option value="Carlos">Carlos</option>
                            <option value="Ana">Ana</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="legenda-profissionais">
                <div class="legenda-item"><span class="legenda-cor color-joao"></span>João</div>
                <div class="legenda-item"><span class="legenda-cor color-maria"></span>Maria</div>
                <div class="legenda-item"><span class="legenda-cor color-carlos"></span>Carlos</div>
                <div class="legenda-item"><span class="legenda-cor color-ana"></span>Ana</div>
            </div>

            <div class="stats-bar">
                <div class="stat-card">
                    <span class="stat-icon">📋</span>
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">Total esta semana</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">📅</span>
                    <span class="stat-value" id="stat-hoje">0</span>
                    <span class="stat-label">Hoje</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">🏆</span>
                    <span class="stat-value" id="stat-prof">-</span>
                    <span class="stat-label">Profissional mais ativo</span>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">⏰</span>
                    <span class="stat-value" id="stat-livre">-</span>
                    <span class="stat-label">Próximo horário livre</span>
                </div>
            </div>

            <div class="agenda-wrapper">
                <div class="agenda-grid" id="agenda-grid">
                    <!-- Javascript will render grid headers and timeslots here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/mobile-navbar.js"></script>
    <script src="/js/agenda.js"></script>
</body>
</html>
